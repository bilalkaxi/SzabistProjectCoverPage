<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SZABIST Student Card - Front</title>
<style>
:root{--navy:#14208f;--g1:#00b95b;--g2:#00a24d;--label:#d9f7a3;--value:#f6ffe6}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:Arial,Helvetica,sans-serif;background:#e7ebe8;color:#222}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #cfd6d1;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.bar p{flex:1 1 320px;line-height:1.35;color:#333}
.bar .hl{background:rgba(255,214,0,.55);padding:0 4px;border-radius:2px}
.bar button{font:600 14px Arial;padding:9px 14px;border:0;border-radius:6px;background:var(--navy);color:#fff;cursor:pointer}
.bar button.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.stage{display:flex;justify-content:center;padding:26px 12px 40px}
.card{width:85.6mm;height:53.98mm;border-radius:3.2mm;overflow:hidden;position:relative;
  background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g1));
  box-shadow:0 6px 22px rgba(0,0,0,.28)}
@media screen and (min-width:900px){.card{zoom:3}}
.head{height:13.6mm;background:#fff;display:flex;align-items:center;gap:2.4mm;padding:0 2.6mm 0 3.2mm;border-bottom:.25mm solid #0a7a3c}
.logo{flex:none;width:17.2mm;height:9.2mm;border:.28mm solid var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.logo b{font:italic 900 4.3mm "Arial Black",Arial,sans-serif;letter-spacing:-.25mm;color:var(--navy)}
.logo small{font:700 .95mm Arial;letter-spacing:.35mm;color:var(--navy);margin-top:.5mm}
.title{color:var(--navy);line-height:1.12;white-space:nowrap}
.title i{display:block;font:italic 700 2.35mm Georgia,"Times New Roman",serif}
.title strong{display:block;font:800 2.62mm Arial,sans-serif;letter-spacing:-.05mm}
.body{position:absolute;left:0;right:0;top:13.85mm;bottom:0}
.tag{position:absolute;writing-mode:vertical-rl;transform:rotate(180deg);font:900 4.6mm Arial,sans-serif;color:var(--navy);letter-spacing:.15mm;top:50%;margin-top:-10mm}
.row{display:flex;align-items:baseline;line-height:1}
.row .l{color:var(--label);font-weight:600;flex:none;letter-spacing:.12mm}
.row .v{color:var(--value);font-weight:600;flex:1;white-space:nowrap}
.f{outline:none}
@media screen{
  .f{outline:1px dashed rgba(255,255,255,.55);outline-offset:.3mm;cursor:text}
  .f.verify{background:rgba(255,214,0,.5);color:#1b2a00}
  .f:focus{outline:1px solid #fff;background:rgba(255,255,255,.25)}
}
.foot{position:absolute;left:0;right:0;bottom:2.1mm;text-align:center;font:600 1.55mm Arial;color:rgba(230,255,200,.85);letter-spacing:.05mm}
.stage-note{display:none}

.logo-img{flex:none;height:10.4mm;width:auto;display:block;image-rendering:auto}
.front .tag{left:2.6mm}
.front .info{position:absolute;left:9.6mm;top:2.4mm;width:52mm}
.front .info .row{font-size:2.35mm;height:4.35mm;align-items:center}
.front .info .l{width:15.4mm}
.front .sig{position:absolute;left:9.6mm;bottom:2.6mm;width:51mm;border-top:.22mm solid rgba(10,40,120,.75);padding-top:.5mm;font:600 1.6mm Arial;color:var(--label);letter-spacing:.1mm}
.photo{position:absolute;right:3mm;top:2.5mm;width:19.5mm;height:24mm;border:.55mm solid var(--navy);border-radius:2.4mm;overflow:hidden;background:linear-gradient(#5cb6f5,#3d9be0);cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;display:none}
.photo .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font:600 1.9mm/1.25 Arial;color:#fff;padding:1mm}
.photo input{display:none}

@media print{
  html,body{background:none}
  .bar{display:none}
  .stage{padding:0}
  .card{box-shadow:none}
  .f{outline:none!important;background:none!important;color:inherit}
  .photo .hint{display:none}
  body[data-mode=a4] .stage{padding:15mm;justify-content:flex-start}
  body[data-mode=a4] .card{box-shadow:0 0 0 .15mm #8a8a8a}
  body[data-mode=card] .stage{height:53.98mm;overflow:hidden;display:block}
}
</style>
<style id="pg">@page{size:A4 portrait;margin:0}</style>
</head>
<body data-mode="a4">
<div class="bar">
  <p>Front side. Click the photo box to add your photo, then fill in the details. <span class="hl">Yellow</span> fields were read from a blurry photo: tap each one, check it against your card, and correct it. Highlights and dashed outlines do not print.</p>
  <button onclick="doPrint('a4')">Print on A4</button>
  <button class="alt" onclick="doPrint('card')">Print at card size</button>
</div>
